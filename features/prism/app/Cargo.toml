[workspace]
members = ["host", "src-tauri"]
default-members = ["host"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
publish = false

[workspace.dependencies]
prism-core = { path = "../prism-core" }
prism-app-host = { path = "host" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "v7", "serde"] }
thiserror = "2"
