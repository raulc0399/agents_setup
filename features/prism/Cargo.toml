[package]
name = "prism"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
description = "A shared visual conversation workspace for coding CLIs"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.41.1", features = ["bundled"] }
uuid = { version = "1", features = ["v4", "serde"] }
thiserror = "2"
sha2 = "0.10"
libc = "0.2.191"
ratatui = "0.30.2"
crossterm = "0.29"
anyhow = "1"
signal-hook = "0.3"
tungstenite = "0.30"
clap = { version = "4", features = ["derive"] }
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "json"] }

[dev-dependencies]
tempfile = "3"
